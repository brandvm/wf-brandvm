name: sitemap
# Rebuilds www.brandvm.com's sitemap.xml (+ group files) from the Webflow API
# every 30 minutes in the daytime (see schedule)
# without running the site's tests. GitHub Pages publishes one package, so this
# republishes the bundles too: dist/ from the last commit whose staging run
# passed (never untested code), plus the fresh sitemap. staging.yml still
# builds the sitemap on every code deploy.
#   gh workflow run sitemap.yml --repo brandvm/wf-brandvm
on:
  # Every 30 min, 6 am–9 pm Toronto time all year (cron is UTC, no DST):
  # 10:00–02:00 UTC = 5 am–9 pm EST (winter), 6 am–10 pm EDT (summer).
  schedule:
    - cron: '0,30 10-23,0-1 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions: { contents: read, actions: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: last tested bundles
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow staging.yml --branch master \
            --status success --limit 20 --json headSha,event \
            -q '[.[] | select(.event != "pull_request")][0].headSha')
          if [ -z "$sha" ]; then echo "::error::no passing staging run found"; exit 1; fi
          echo "bundles from $sha"
          git checkout "$sha" -- dist
          mkdir -p _site && cp -R dist/. _site/
      # Fails (and publishes nothing) if the API errors: the live sitemap stays.
      - name: sitemap
        env: { WEBFLOW_TOKEN: '${{ secrets.WEBFLOW_TOKEN }}' }
        run: node scripts/sitemap.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages }
    # One deploy at a time with staging.yml; a running deploy is never cancelled.
    concurrency: { group: pages-deploy, cancel-in-progress: false }
    steps:
      - uses: actions/deploy-pages@v4
