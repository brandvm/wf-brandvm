     first, so the tags stay off the critical path (Home performance, 2026-10-20).
     Original snippet: brandvm/wf-brandvm docs/audit/2026-10-20-tags.md -->
<script>
  (function (w, d, l, i) {
    w[l] = w[l] || [];
    w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
    var events = ['scroll', 'pointerdown', 'pointermove', 'keydown', 'touchstart'];
    var loaded = false;
    function load() {
      if (loaded) return;
      loaded = true;
      events.forEach(function (e) { w.removeEventListener(e, load, true); });
      var j = d.createElement('script');
      j.async = true;
      j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i;
      d.head.appendChild(j);
    }
    events.forEach(function (e) { w.addEventListener(e, load, { capture: true, passive: true }); });
    if (d.readyState === 'complete') setTimeout(load, 3500);
    else w.addEventListener('load', function () { setTimeout(load, 3500); });
  })(window, document, 'dataLayer', 'GTM-T8GBTH3J');
</script>

<!-- wf-brandvm loader, piece 1 (config + connection warming). Source: brandvm/wf-brandvm loader.html -->
<script>
  (function () {
    var RELEASE = "1.4.7"; // the release tag, e.g. "1.0.0" — the only version string
    var OWNER = "brandvm"; // the GitHub org or user that owns this repo
    var SITE = "wf-brandvm"; // this repo's name
    var STAG = "https://" + OWNER + ".github.io/" + SITE + "/";
    var DEV = "http://localhost:3000/";
    // *.canvas.webflow.com is the Designer's custom-code preview: a separate
    // origin, with its own URL flag and localStorage.
    var staging = /\.webflow\.io$|\.canvas\.webflow\.com$/.test(location.hostname);
    var q = new URLSearchParams(location.search);
    var flag = staging && q.get("wfc-dev") === "1";
    try {
      if (staging && q.has("wfc-dev")) localStorage.setItem("wfc-dev", flag ? "1" : "0");
      if (staging && !q.has("wfc-dev")) flag = localStorage.getItem("wfc-dev") === "1";
    } catch (e) { /* An explicit URL flag still works without storage. */ }
    var prod = RELEASE
      ? "https://cdn.jsdelivr.net/gh/" + OWNER + "/" + SITE + "@" + RELEASE + "/dist/"
      : STAG;
    if (!staging && !RELEASE)
      console.error("[wfc] RELEASE is not set in head code; serving the staging bundle. Tag a release and set RELEASE before launch.");
    // Warm the connection to wherever the bundle comes from (GitHub Pages
    // on staging, jsDelivr with a RELEASE, localhost in dev mode). A fixed
    // jsDelivr preconnect went unused on staging and before the first
    // release. Two links on purpose: the stylesheet and its font fetches
    // are CORS-different and open separate connections.
    var origin = new URL(flag ? DEV : staging ? STAG : prod).origin;
    [false, true].forEach(function (cors) {
      var warm = document.createElement("link");
      warm.rel = "preconnect";
      warm.href = origin;
      if (cors) warm.crossOrigin = "";
      document.head.appendChild(warm);
    });
    // The canvas Embed (2a) must link the staging stylesheet, for the
    // Designer. On a release domain, write the pinned sheet into <head>
    // instead: a parser-inserted head stylesheet holds first paint in every
    // browser, so the page never paints at the wrong scale (§01). Then
    // re-point 2a at the same file as the parser inserts it (one request;
    // the observer runs before 2b), so GitHub Pages never holds the page and
    // 2b's swap is a no-op. If the observer misses, 2b swaps as before.
    if (!staging && RELEASE) {
      var want = prod + "styles.css";
      document.write('<link rel="stylesheet" href="' + want + '">');
      if (window.MutationObserver) {
        var watch = new MutationObserver(function () {
          var link = document.getElementById("wfc-css");
          if (!link) return;
          watch.disconnect();
          if (link.href !== want) link.href = want;
        });
        watch.observe(document.documentElement, { childList: true, subtree: true });
        document.addEventListener("DOMContentLoaded", function () { watch.disconnect(); });
      }
    }
    // Shared config — the Embed, the footer loader and the bundle read this.
    window.WFC = {
      staging: staging, dev: flag, devBase: DEV, stag: STAG,
      release: RELEASE, prod: prod,
    };

    // No pre-paint scroll lock on brandvm.com (decision D1): the live site
    // never had one, and the parity release changes nothing visitors see.
  })();
</script>
